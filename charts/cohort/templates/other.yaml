apiVersion: v1
kind: Service
metadata:
  name: {{ include "cohort.fullname" . }}
  labels: {{- include "cohort.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector: {{- include "cohort.selectorLabels" . | nindent 4 }}

{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cohort.fullname" . }}-artifacts
  labels: {{- include "cohort.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}

{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cohort.fullname" . }}
  labels: {{- include "cohort.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cohort.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

{{- if .Values.scan.enabled }}
---
# Posture drifts continuously — people share things every day — so a baseline is
# only as good as its last scan. Concurrency is forbidden because two scans
# writing the same artifact volume would race.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cohort.fullname" . }}-scan
  labels: {{- include "cohort.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.scan.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.scan.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.scan.activeDeadlineSeconds }}
      template:
        spec:
          restartPolicy: OnFailure
          securityContext: {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: scan
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              securityContext: {{- toYaml .Values.securityContext | nindent 16 }}
              command: ["cohort", "demo", "--documents", "{{ .Values.scan.documents }}"]
              resources: {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: artifacts
                  mountPath: {{ .Values.persistence.mountPath }}
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: artifacts
              {{- if .Values.persistence.enabled }}
              persistentVolumeClaim:
                claimName: {{ include "cohort.fullname" . }}-artifacts
              {{- else }}
              emptyDir: {}
              {{- end }}
            - name: tmp
              emptyDir: {}
{{- end }}

{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cohort.fullname" . }}
  labels: {{- include "cohort.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ include "cohort.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "cohort.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
