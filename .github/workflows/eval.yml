name: eval

# Runs the detection benchmark on every pull request, comments the metrics table,
# and fails the build if quality regressed. Unit tests catch code that throws;
# this catches a change that quietly makes the model worse.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: generate corpus
        run: cohort generate --documents 15000 --seed 1337 --out artifacts/corpus

      - name: evaluate
        run: cohort evaluate --out artifacts/reports

      - name: check for regression
        id: check
        run: |
          python scripts/check_regression.py \
            --current artifacts/reports/evaluation.json \
            --baseline benchmarks/baseline.json \
            --tolerance 0.05 \
            --markdown artifacts/reports/pr_comment.md

      - name: comment on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: artifacts/reports/pr_comment.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: |
            artifacts/reports/evaluation.md
            artifacts/reports/evaluation.json

      # Refresh the committed baseline only from main, and only when it improved.
      - name: refresh baseline
        if: github.ref == 'refs/heads/main' && success()
        run: |
          cp artifacts/reports/evaluation.json benchmarks/baseline.json
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/baseline.json
          git diff --staged --quiet || git commit -m "chore: refresh benchmark baseline [skip ci]"
          git push || echo "nothing to push"
