name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: ruff (lint)
        run: ruff check src tests scripts
      - name: ruff (format check)
        run: ruff format --check src tests scripts
      - name: mypy
        run: mypy src/cohort

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - name: pytest
        run: pytest -q --cov=cohort --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  determinism:
    # A benchmark whose corpus is not byte-reproducible cannot support a
    # regression gate, so reproducibility is verified as its own job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: generate twice and compare digests
        run: |
          cohort generate --documents 2000 --seed 4242 --out /tmp/a
          cohort generate --documents 2000 --seed 4242 --out /tmp/b
          a=$(sha256sum /tmp/a/corpus.parquet | cut -d' ' -f1)
          b=$(sha256sum /tmp/b/corpus.parquet | cut -d' ' -f1)
          echo "a=$a"; echo "b=$b"
          test "$a" = "$b" || { echo "::error::corpus generation is not deterministic"; exit 1; }

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cohort:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test the image
        run: |
          docker run --rm cohort:ci cohort version
          docker run --rm -v ${{ github.workspace }}/out:/app/artifacts cohort:ci \
            sh -c "cohort generate --documents 1500 --out /app/artifacts/corpus && cohort scan --findings 25"
      - name: trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: cohort:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
