name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: ruff (lint)
        run: ruff check src tests scripts
      - name: ruff (format check)
        run: ruff format --check src tests scripts
      - name: mypy
        run: mypy src/cohort

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - name: pytest
        run: pytest -q --cov=cohort --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  determinism:
    # A benchmark whose corpus is not byte-reproducible cannot support a
    # regression gate, so reproducibility is verified as its own job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: generate twice and compare digests
        run: |
          cohort generate --documents 2000 --seed 4242 --out /tmp/a
          cohort generate --documents 2000 --seed 4242 --out /tmp/b
          a=$(sha256sum /tmp/a/corpus.parquet | cut -d' ' -f1)
          b=$(sha256sum /tmp/b/corpus.parquet | cut -d' ' -f1)
          echo "a=$a"; echo "b=$b"
          test "$a" = "$b" || { echo "::error::corpus generation is not deterministic"; exit 1; }

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cohort:ci
          # Layer caching deliberately disabled. Two dependency fixes in a row
          # showed no change in the scan output, and a stale cached layer is the
          # likeliest cause; correctness of the shipped image outweighs a couple
          # of minutes of build time on a repo this size.
          no-cache: true
      - name: smoke test the image
        # No host bind mount. The image runs as uid 10001 and Docker creates a
        # bind-mount source as root, so the container could not write to it.
        # The smoke test only needs the pipeline to complete, not to persist.
        run: |
          docker run --rm cohort:ci cohort version
          docker run --rm cohort:ci \
            sh -c "cohort generate --documents 1500 --out /app/artifacts/corpus && cohort scan --findings 25"
      # Two passes on purpose. The first always succeeds and writes the findings
      # into the job summary, so the CVE list is readable on the run page even
      # when the gate below fails. A gate that fails without telling you what it
      # found costs an extra round trip every time.
      - name: trivy report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cohort:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: "0"
      - name: publish findings
        if: always()
        # Emits each CVE as a workflow error annotation as well as writing the
        # job summary. Annotations surface through the public check-runs API,
        # whereas job summaries and raw logs need repo-admin rights -- so this is
        # the difference between "the build is red" and "the build is red
        # because of these five packages", for anyone looking from outside.
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib, collections
          p = pathlib.Path("trivy.json")
          if not p.exists():
              print("### Trivy\n\n(no report produced)"); raise SystemExit
          data = json.loads(p.read_text())
          rows = []
          for res in data.get("Results") or []:
              for v in res.get("Vulnerabilities") or []:
                  rows.append((v.get("Severity"),
                               v.get("PkgPath") or res.get("Target",""),
                               v.get("PkgName"), v.get("InstalledVersion"),
                               v.get("FixedVersion"), v.get("VulnerabilityID")))
          print("### Trivy: HIGH/CRITICAL with fixes available\n")
          if not rows:
              print("None. :white_check_mark:"); raise SystemExit
          by_pkg = collections.Counter(r[2] for r in rows)
          print(f"**{len(rows)} findings across {len(by_pkg)} packages.**\n")
          print("| Severity | Package | Installed | Fixed in | CVE | Found in |")
          print("|---|---|---|---|---|---|")
          for sev, tgt, pkg, cur, fix, cve in sorted(rows):
              print(f"| {sev} | `{pkg}` | {cur} | **{fix}** | {cve} | `{tgt}` |")
          # Annotations: one line per package, kept short enough to stay readable.
          for pkg, n in by_pkg.most_common():
              worst = [r for r in rows if r[2] == pkg]
              fixes = sorted({r[4] for r in worst if r[4]})
              targets = sorted({r[1] for r in worst})
              print(f"::error title=Trivy::{pkg} {worst[0][3]} -> fix {','.join(fixes)} "
                    f"in {'; '.join(targets)} "
                    f"({n} CVE(s): {','.join(sorted({r[5] for r in worst})[:4])})",
                    file=__import__("sys").stderr)
          PY

      - name: trivy gate
        # Pinned to a real released tag. Tags here are v-prefixed; an invalid
        # action reference fails the whole job at "Set up job", before any step
        # runs, which is what happened with the previous value.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cohort:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Only fail on vulnerabilities that actually have a fix available.
          # Blocking on unfixable base-image CVEs would turn CI red for something
          # no change to this repository could resolve -- and a permanently red
          # badge trains everyone to ignore it.
          ignore-unfixed: true
