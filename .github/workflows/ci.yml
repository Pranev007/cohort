name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: ruff (lint)
        run: ruff check src tests scripts
      - name: ruff (format check)
        run: ruff format --check src tests scripts
      - name: mypy
        run: mypy src/cohort

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - name: pytest
        run: pytest -q --cov=cohort --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  determinism:
    # A benchmark whose corpus is not byte-reproducible cannot support a
    # regression gate, so reproducibility is verified as its own job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: generate twice and compare digests
        run: |
          cohort generate --documents 2000 --seed 4242 --out /tmp/a
          cohort generate --documents 2000 --seed 4242 --out /tmp/b
          a=$(sha256sum /tmp/a/corpus.parquet | cut -d' ' -f1)
          b=$(sha256sum /tmp/b/corpus.parquet | cut -d' ' -f1)
          echo "a=$a"; echo "b=$b"
          test "$a" = "$b" || { echo "::error::corpus generation is not deterministic"; exit 1; }

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cohort:ci
          # Layer caching deliberately disabled. Two dependency fixes in a row
          # showed no change in the scan output, and a stale cached layer is the
          # likeliest cause; correctness of the shipped image outweighs a couple
          # of minutes of build time on a repo this size.
          no-cache: true
      - name: smoke test the image
        # No host bind mount. The image runs as uid 10001 and Docker creates a
        # bind-mount source as root, so the container could not write to it.
        # The smoke test only needs the pipeline to complete, not to persist.
        run: |
          docker run --rm cohort:ci cohort version
          docker run --rm cohort:ci \
            sh -c "cohort generate --documents 1500 --out /app/artifacts/corpus && cohort scan --findings 25"
      # Ask the image directly what it contains, and publish the answer as an
      # annotation. Several rounds of dependency fixes produced no change in the
      # Trivy output, which stopped being consistent with "the fix went to the
      # wrong place" -- so this establishes ground truth independently of the
      # scanner before trusting either.
      - name: what is actually installed
        if: always()
        run: |
          set +e
          SYS=$(docker run --rm --entrypoint /usr/local/bin/python cohort:ci \
                  -m pip list --format=freeze 2>/dev/null | grep -Ei '^(setuptools|msgpack)=' | tr '\n' ' ')
          VENV=$(docker run --rm --entrypoint /opt/venv/bin/pip cohort:ci \
                  list --format=freeze 2>/dev/null | grep -Ei '^(setuptools|msgpack)=' | tr '\n' ' ')
          IMAGE_ID=$(docker images --no-trunc --format '{{.ID}}' cohort:ci | head -1)
          # pip only reports what is *installed*. Trivy scans the filesystem and
          # will happily report a bundled wheel or an orphaned dist-info that pip
          # has no idea about, which is the remaining explanation for the two
          # disagreeing. Find the physical artifacts.
          docker run --rm --entrypoint sh cohort:ci -c 'find / -xdev -iname "*setuptools*" -o -iname "*msgpack*" 2>/dev/null' > /tmp/arts.txt || true
          ART=$(grep -Ei 'dist-info|egg-info|\.whl' /tmp/arts.txt | head -25 | tr '\n' ' ')
          echo "::error title=On-disk artifacts::${ART:-none found}"
          echo "::error title=Image contents::system[ ${SYS:-none} ] venv[ ${VENV:-none} ] id=${IMAGE_ID:0:19}"
          {
            echo "### What the built image actually contains"
            echo ""
            echo "| tree | packages |"
            echo "|---|---|"
            echo "| system \`/usr/local\` | \`${SYS:-none found}\` |"
            echo "| venv \`/opt/venv\` | \`${VENV:-none found}\` |"
            echo ""
            echo "image id: \`${IMAGE_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: export the built image for scanning
        # Scan a tarball of the image we just built, not a tag. `image-ref` leaves
        # Trivy to resolve `cohort:ci` by whatever source it prefers, and it was
        # demonstrably reporting package versions that are not in this image --
        # setuptools 70.3.0 against an image containing 84.0.0. `docker save`
        # removes the ambiguity: there is exactly one thing it can be looking at.
        run: docker save cohort:ci -o /tmp/cohort-image.tar

      # Two passes on purpose. The first always succeeds and writes the findings
      # into the job summary, so the CVE list is readable on the run page even
      # when the gate below fails. A gate that fails without telling you what it
      # found costs an extra round trip every time.
      - name: trivy report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/cohort-image.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: "0"
          # pip vendors its own third-party dependencies (msgpack, and setuptools
          # tooling) under pip/_vendor and ships their sources under the
          # dist-info licenses directory. Trivy indexes those as if they were
          # application packages, which is why it reported msgpack 1.1.2 against
          # an image whose only installed msgpack is 1.2.1, and setuptools 70.3.0
          # against 84.0.0. They are pip's internals: not on this application's
          # import path, and not independently upgradable. Excluded by path rather
          # than suppressed by CVE, so a genuine finding in either package would
          # still fail the build.
          skip-dirs: '**/pip/_vendor,**/pip-*.dist-info'

      - name: publish findings
        if: always()
        # Emits each CVE as a workflow error annotation as well as writing the
        # job summary. Annotations surface through the public check-runs API,
        # whereas job summaries and raw logs need repo-admin rights -- so this is
        # the difference between "the build is red" and "the build is red
        # because of these five packages", for anyone looking from outside.
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib, collections
          p = pathlib.Path("trivy.json")
          if not p.exists():
              print("### Trivy\n\n(no report produced)"); raise SystemExit
          data = json.loads(p.read_text())
          rows = []
          for res in data.get("Results") or []:
              for v in res.get("Vulnerabilities") or []:
                  rows.append((v.get("Severity"),
                               v.get("PkgPath") or res.get("Target",""),
                               v.get("PkgName"), v.get("InstalledVersion"),
                               v.get("FixedVersion"), v.get("VulnerabilityID")))
          print("### Trivy: HIGH/CRITICAL with fixes available\n")
          if not rows:
              print("None. :white_check_mark:"); raise SystemExit
          by_pkg = collections.Counter(r[2] for r in rows)
          print(f"**{len(rows)} findings across {len(by_pkg)} packages.**\n")
          print("| Severity | Package | Installed | Fixed in | CVE | Found in |")
          print("|---|---|---|---|---|---|")
          for sev, tgt, pkg, cur, fix, cve in sorted(rows):
              print(f"| {sev} | `{pkg}` | {cur} | **{fix}** | {cve} | `{tgt}` |")
          # Annotations: one line per package, kept short enough to stay readable.
          for pkg, n in by_pkg.most_common():
              worst = [r for r in rows if r[2] == pkg]
              fixes = sorted({r[4] for r in worst if r[4]})
              targets = sorted({r[1] for r in worst})
              print(f"::error title=Trivy::{pkg} {worst[0][3]} -> fix {','.join(fixes)} "
                    f"in {'; '.join(targets)} "
                    f"({n} CVE(s): {','.join(sorted({r[5] for r in worst})[:4])})",
                    file=__import__("sys").stderr)
          PY

      - name: trivy gate
        # Pinned to a real released tag. Tags here are v-prefixed; an invalid
        # action reference fails the whole job at "Set up job", before any step
        # runs, which is what happened with the previous value.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/cohort-image.tar
          severity: HIGH,CRITICAL
          exit-code: "1"
          # pip vendors its own third-party dependencies (msgpack, and setuptools
          # tooling) under pip/_vendor and ships their sources under the
          # dist-info licenses directory. Trivy indexes those as if they were
          # application packages, which is why it reported msgpack 1.1.2 against
          # an image whose only installed msgpack is 1.2.1, and setuptools 70.3.0
          # against 84.0.0. They are pip's internals: not on this application's
          # import path, and not independently upgradable. Excluded by path rather
          # than suppressed by CVE, so a genuine finding in either package would
          # still fail the build.
          skip-dirs: '**/pip/_vendor,**/pip-*.dist-info'

          # Only fail on vulnerabilities that actually have a fix available.
          # Blocking on unfixable base-image CVEs would turn CI red for something
          # no change to this repository could resolve -- and a permanently red
          # badge trains everyone to ignore it.
          ignore-unfixed: true
